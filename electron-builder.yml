appId: dev.cayden.converter
productName: Converter
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# The vendored tools must stay OUTSIDE the asar archive: they are executables
# and dylibs, and macOS cannot exec or dlopen a file inside an asar.
extraResources:
  - from: resources/bin
    to: bin
    filter: ["**/*"]
asar: true
mac:
  # Generated from build/icon.ico via iconutil. The source tops out at 256px,
  # so the 512 and 1024 iconset entries are upscaled - a larger master would
  # sharpen the Finder icon at big sizes.
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  hardenedRuntime: false
  # Ad-hoc signing by decision: the available certificate is an Apple
  # Development identity, which cannot notarize. `null` makes electron-builder
  # skip its own signing so the vendor script's ad-hoc signatures survive.
  identity: null
win:
  # build/icon.ico is the SOURCE the mac .icns was generated from, so it is
  # already in the repo at its native resolution.
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No code signing: there is no Windows certificate, so SmartScreen shows an
  # unrecognised-app warning on first run. This is the Windows counterpart of
  # the unnotarized macOS build, and is documented in the README rather than
  # left for the user to discover.
nsis:
  # Per-user install, so no UAC prompt. A machine-wide install would need
  # elevation for an app that writes nothing outside the user's own files.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
portable:
  artifactName: ${productName}-${version}-portable.${ext}
